  <script>
    (() => {
      const state = window.portfolioIntro = { enabled: false };
      try {
        const legacy = location.pathname === '/' && ['work','about','contact'].includes(location.hash.slice(1));
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches || localStorage.getItem('vikram-motion') === 'off';
        const home = location.pathname === '/' || location.pathname === '/index.html';
        state.enabled = !legacy && !reduced && (home || new URLSearchParams(location.search).get('intro') === '1' || sessionStorage.getItem('vikram-intro-seen-v1') !== '1');
      } catch { state.enabled = !matchMedia('(prefers-reduced-motion: reduce)').matches; }
      if (!state.enabled) return;
      document.documentElement.classList.add('intro-pending');
      state.watchdog = setTimeout(() => {
        if (window.finishPortfolioIntro) window.finishPortfolioIntro();
        else { document.documentElement.classList.remove('intro-pending'); try { sessionStorage.setItem('vikram-intro-seen-v1','1'); } catch {} }
      }, 5200);
    })();
  </script>
